<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Student Task Manager</h1>
            <p>Organize your study tasks easily</p>
        </div>
    </header>


    <main class="container">

        <!-- Add Task Section -->

        <section class="task-form">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="input-group">

                    <label for="taskTitle">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Enter task title"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="taskDescription">
                        Description
                    </label>

                    <textarea
                        id="taskDescription"
                        placeholder="Enter task description"
                    ></textarea>

                </div>


                <div class="input-group">

                    <label for="taskDate">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="taskDate"
                        required
                    >

                </div>


                <button type="submit">
                    Add Task
                </button>

            </form>

        </section>


        <!-- Task List -->

        <section class="tasks-section">

            <div class="section-header">

                <h2>My Tasks</h2>

                <select id="filterTasks">

                    <option value="all">
                        All Tasks
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                </select>

            </div>


            <div id="taskList">

                <!-- Tasks will appear here -->

            </div>

        </section>

    </main>


    <footer>

        <p>
            Student Task Manager © 2026
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
